<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Trish Badd — Content Studio</title>
<meta name="theme-color" content="#141210">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Trish Badd">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-512.png">
<link rel="icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#f5efe4;--bg2:#ece4d5;--card:#fffcf6;
  --ink:#17140f;--dim:#6f665a;
  --gold:#9a7337;--gold2:#c9a66b;--gold-faint:rgba(154,115,55,.12);
  --line:rgba(23,20,15,.13);--line-hi:rgba(23,20,15,.28);
  --ok:#2f6b4a;--ok-bg:rgba(47,107,74,.12);
  --warn:#9a5d16;--warn-bg:rgba(154,93,22,.12);
  --bad:#9b2c2c;--bad-bg:rgba(155,44,44,.10);
  --head-bg:#141210;--head-ink:#f3ead9;
  --shadow:0 1px 2px rgba(23,20,15,.06),0 4px 14px rgba(23,20,15,.05);
}
body.dark{
  --bg:#100f0d;--bg2:#181613;--card:#1c1a16;
  --ink:#f0e7d8;--dim:#a39886;
  --gold:#d4b27a;--gold2:#e2c58f;--gold-faint:rgba(212,178,122,.12);
  --line:rgba(240,231,216,.12);--line-hi:rgba(240,231,216,.28);
  --ok:#7cc49b;--ok-bg:rgba(124,196,155,.12);
  --warn:#e0a85c;--warn-bg:rgba(224,168,92,.12);
  --bad:#e08080;--bad-bg:rgba(224,128,128,.12);
  --head-bg:#0a0908;--head-ink:#f3ead9;
  --shadow:none;
}
html{-webkit-text-size-adjust:100%;}
body{background:var(--bg);color:var(--ink);font-family:'Jost',system-ui,sans-serif;font-size:15px;line-height:1.5;min-height:100vh;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;}
a{color:var(--gold);}

/* ── HEADER ── */
.site-header{background:var(--head-bg);color:var(--head-ink);text-align:center;padding:calc(22px + env(safe-area-inset-top)) 16px 18px;position:relative;}
.eyebrow{font-size:11px;letter-spacing:5px;color:#c9a66b;text-transform:uppercase;}
.site-header h1{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:clamp(34px,9vw,52px);letter-spacing:8px;line-height:1.1;margin:6px 0 2px;}
.tagline{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;color:rgba(243,234,217,.7);}
.head-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px;flex-wrap:wrap;}
.switch-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border:1px solid rgba(201,166,107,.6);border-radius:999px;color:#e2c58f;text-decoration:none;font-size:13px;letter-spacing:.3px;}
.switch-pill:active{background:rgba(201,166,107,.15);}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:rgba(243,234,217,.55);}
#sync-dot{width:8px;height:8px;border-radius:50%;background:#777;}

/* ── NAV ── */
.nav{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);}
.nav-row{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;scrollbar-width:none;}
.nav-row::-webkit-scrollbar{display:none;}
.nav-row + .nav-row{padding-top:0;}
.group-btn{flex:none;border:1px solid var(--line-hi);background:transparent;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;white-space:nowrap;}
.group-btn.active{background:var(--ink);color:var(--bg);border-color:var(--ink);}
.panel-btn{flex:none;border:none;background:transparent;border-bottom:2px solid transparent;padding:4px 8px 6px;font-size:13.5px;color:var(--dim);white-space:nowrap;}
.panel-btn.active{color:var(--ink);border-bottom-color:var(--gold);font-weight:600;}

/* ── LAYOUT ── */
#panel{max-width:860px;margin:0 auto;padding:18px 16px 100px;}
h2.ptitle{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:700;line-height:1.15;}
.psub{color:var(--dim);font-size:14px;margin:2px 0 16px;}
h3.sec{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;margin:22px 0 10px;display:flex;align-items:center;gap:8px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);margin-bottom:10px;}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:6px;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;}
.stat b{display:block;font-family:'Cormorant Garamond',serif;font-size:28px;line-height:1.1;}
.stat span{font-size:12px;color:var(--dim);}
.muted{color:var(--dim);}
.small{font-size:13px;}
.empty{text-align:center;color:var(--dim);padding:28px 12px;border:1px dashed var(--line-hi);border-radius:14px;}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-hi);background:var(--card);border-radius:10px;padding:8px 14px;font-size:14px;font-weight:500;}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);}
.btn.gold{background:var(--gold);color:#fff;border-color:var(--gold);}
body.dark .btn.gold{color:#141210;}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px;}
.btn.ghost{background:transparent;}
.btn:active{transform:scale(.98);}
.icon-btn{border:none;background:transparent;font-size:16px;padding:4px 6px;border-radius:8px;color:var(--dim);}
.icon-btn:active{background:var(--gold-faint);}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.spacer{flex:1;}

/* ── TOOLBAR ── */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.toolbar input,.toolbar select{border:1px solid var(--line-hi);background:var(--card);border-radius:10px;padding:8px 10px;font-size:14px;min-width:0;}
.toolbar input{flex:1 1 160px;}

/* ── RECORD CARDS ── */
.rec{display:flex;gap:12px;}
.rec .thumb{width:72px;height:72px;border-radius:10px;object-fit:cover;flex:none;background:var(--bg2);}
.rec .body{flex:1;min-width:0;}
.rec .t{font-weight:600;font-size:15.5px;word-wrap:break-word;}
.rec .s{font-size:13px;color:var(--dim);}
.rec .n{font-size:13.5px;margin-top:6px;white-space:pre-wrap;word-wrap:break-word;}
.rec .acts{display:flex;flex-direction:column;gap:2px;flex:none;}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
.chip{font-size:11.5px;padding:2px 9px;border-radius:999px;background:var(--gold-faint);color:var(--ink);border:1px solid var(--line);white-space:nowrap;}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent;}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent;}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent;}
.stars{color:var(--gold);letter-spacing:1px;font-size:13px;}

/* ── PILLARS ── */
.pillar-tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;width:100%;box-shadow:var(--shadow);}
.pillar-tile .e{font-size:26px;}
.pillar-tile .nm{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:700;margin-top:2px;}
.pillar-tile .bl{font-size:13px;color:var(--dim);}
.pillar-tile.star{border-color:var(--gold);}
.badge{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);font-weight:600;}
.idea-row{display:flex;gap:8px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);}
.idea-row:last-child{border-bottom:none;}
.idea-row .tx{flex:1;font-size:14.5px;}
.idea-row .saved{color:var(--ok);font-size:12px;}
.hook{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);}
.hook:last-child{border-bottom:none;}
.hook .tx{flex:1;font-size:14.5px;}
.tags{font-size:13px;color:var(--dim);word-wrap:break-word;}

/* ── GENERATOR ── */
.gen-out{border:1px solid var(--gold);border-radius:16px;padding:18px;background:var(--card);}
.gen-out .lbl{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:600;margin-top:12px;}
.gen-out .lbl:first-child{margin-top:0;}
.gen-out .big{font-family:'Cormorant Garamond',serif;font-size:25px;font-weight:700;line-height:1.2;}

/* ── CALENDAR ── */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.cal-head b{font-family:'Cormorant Garamond',serif;font-size:24px;}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal .dow{text-align:center;font-size:11px;color:var(--dim);letter-spacing:1px;padding-bottom:2px;}
.cal .day{min-height:58px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:4px;text-align:left;display:flex;flex-direction:column;overflow:hidden;}
.cal .day.out{opacity:.35;}
.cal .day.today{border-color:var(--gold);}
.cal .day.sel{outline:2px solid var(--ink);outline-offset:-1px;}
.cal .day .dn{font-size:12px;font-weight:600;}
.cal .day .ems{font-size:13px;line-height:1.2;word-break:break-all;}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(10,9,8,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));}
@media(min-width:600px){.overlay{align-items:center;}.sheet{border-radius:20px;}}
.sheet h3{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:700;margin-bottom:10px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin-bottom:4px;font-weight:500;}
.field input:not([type=checkbox]),.field select,.field textarea{width:100%;border:1px solid var(--line-hi);background:var(--card);border-radius:10px;padding:10px;font-size:16px;}
.field textarea{min-height:84px;resize:vertical;}
.field .check{display:flex;align-items:center;gap:8px;font-size:15px;text-transform:none;letter-spacing:0;color:var(--ink);}
.field .check input{width:20px;height:20px;accent-color:var(--gold);}
.photo-prev{max-width:140px;border-radius:10px;display:block;margin-bottom:6px;}
.sheet-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;position:sticky;bottom:0;background:var(--bg);padding-top:8px;}

/* ── CHECKLIST ── */
.ck{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
.ck input{width:20px;height:20px;accent-color:var(--gold);flex:none;}
.ck .tx{flex:1;}
.ck.done .tx{text-decoration:line-through;color:var(--dim);}

/* ── XXL NAIL DIARIES ── */
.xxl-hero{background:var(--head-bg);color:var(--head-ink);border-radius:18px;padding:18px 16px;margin-bottom:14px;}
body.dark .xxl-hero{border:1px solid rgba(201,166,107,.35);}
.xxl-hero .eyebrow{font-size:10.5px;letter-spacing:4px;}
.xxl-hero h2{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:700;line-height:1.05;margin:4px 0 6px;color:var(--head-ink);}
.xxl-hero p{font-size:13.5px;color:rgba(243,234,217,.72);}
.xxl-prog{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:12px;}
.xxl-prog div{text-align:center;border:1px solid rgba(201,166,107,.35);border-radius:8px;padding:5px 2px;}
.xxl-prog b{display:block;font-family:'Cormorant Garamond',serif;font-size:20px;line-height:1.1;color:#e2c58f;}
.xxl-prog span{font-size:9.5px;letter-spacing:.3px;color:rgba(243,234,217,.65);}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px;padding-bottom:2px;}
.seg::-webkit-scrollbar{display:none;}
.seg button{flex:none;border:1px solid var(--line-hi);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap;}
.seg button.active{background:var(--gold);border-color:var(--gold);color:#fff;}
body.dark .seg button.active{color:#141210;}
details.ep{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;box-shadow:var(--shadow);}
details.ep[open]{border-color:var(--gold2);}
details.ep summary{list-style:none;padding:14px;cursor:pointer;}
details.ep summary::-webkit-details-marker{display:none;}
details.ep .ser{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold);font-weight:600;}
details.ep .et{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:700;line-height:1.2;margin:2px 0 4px;word-wrap:break-word;}
details.ep .eh{font-size:13.5px;color:var(--dim);font-style:italic;word-wrap:break-word;}
details.ep .ebody{padding:0 14px 14px;border-top:1px solid var(--line);}
.ep .lbl{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold);font-weight:600;margin:12px 0 4px;}
.ep ol{padding-left:20px;font-size:14px;}
.ep ol li{margin-bottom:3px;}
.ep .cap{font-size:14px;white-space:pre-wrap;word-wrap:break-word;}
.ep select{border:1px solid var(--line-hi);background:var(--card);border-radius:8px;padding:6px 8px;font-size:14px;max-width:100%;}
.ep .ctrls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
.ep .ctrls label{display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin-bottom:3px;}
.ep .ctrls select{width:100%;}
.verdict-Easy{background:var(--ok-bg);color:var(--ok);}
.verdict-Takes{background:var(--warn-bg);color:var(--warn);}
.verdict-Not{background:var(--bad-bg);color:var(--bad);}

/* ── SCENT DIARIES: PAIRING GUIDE ── */
.occ{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);}
.occ .on{font-family:'Cormorant Garamond',serif;font-size:23px;font-weight:700;line-height:1.15;}
.occ .vibe{font-size:13.5px;color:var(--dim);font-style:italic;margin-bottom:6px;}
.combo{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);}
.combo .cx{flex:1;min-width:0;}
.combo .cn{font-weight:600;font-size:15px;}
.combo .cw{font-size:13px;color:var(--dim);}
.mine{background:var(--gold-faint);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px;}

/* ── PLATFORMS / TODAY / PINTEREST ── */
.plat{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;background:var(--bg);}
.plat .ph{display:flex;align-items:center;gap:8px;}
.plat .pn{font-weight:600;font-size:14px;flex:1;}
.plat .pw{font-size:12px;color:var(--gold);font-weight:600;}
.plat .pt{font-size:13.5px;white-space:pre-wrap;word-wrap:break-word;margin-top:4px;}
.plat .pm{font-size:12.5px;color:var(--dim);margin-top:4px;}
.today{background:var(--head-bg);color:var(--head-ink);border-radius:18px;padding:16px;margin-bottom:14px;}
body.dark .today{border:1px solid rgba(201,166,107,.35);}
.today .tl{font-size:10.5px;letter-spacing:3px;text-transform:uppercase;color:#c9a66b;font-weight:600;}
.today .ti{border-top:1px solid rgba(243,234,217,.14);padding:10px 0;}
.today .ti:first-of-type{border-top:none;}
.today .tt{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:700;line-height:1.2;}
.today .tw{font-size:13px;color:#e2c58f;margin-top:2px;}
.today .te{font-size:13.5px;color:rgba(243,234,217,.65);padding:6px 0;}
.today .btn{background:transparent;color:#e2c58f;border-color:rgba(201,166,107,.6);}
.kw{display:inline-block;margin:0 6px 6px 0;}

/* ── TOAST ── */
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:99;max-width:90vw;text-align:center;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.alert{border-left:3px solid var(--warn);background:var(--warn-bg);padding:10px 12px;border-radius:8px;margin-bottom:8px;font-size:14px;}
.pick-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:600;}
.pick-idea{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:700;line-height:1.25;margin:4px 0 10px;}
</style>
</head>
<body>

<header class="site-header">
  <div class="eyebrow">✦ Content Studio ✦</div>
  <h1>TRISH BADD</h1>
  <div class="tagline">Lifestyle · GRWM · Nails · Hauls</div>
  <div class="head-row">
    <a class="switch-pill" href="../">📚 Switch to Titles by Trish</a>
    <span class="sync"><span id="sync-dot"></span><span id="sync-txt">Connecting…</span></span>
  </div>
</header>

<nav class="nav">
  <div class="nav-row" id="group-row"></div>
  <div class="nav-row" id="panel-row"></div>
</nav>

<main id="panel"></main>
<div id="modal-root"></div>
<div id="toast"></div>

<script>

  hooks:[

    'My nail tech has never let me down… until today?',

    'I told my nail tech to surprise me and…',
    'The nail set everyone keeps asking me about',
    'How much I actually pay for my nails',

const PILLAR_NAMES = PILLARS.map(p=>p.name);
const pillarBy = n => PILLARS.find(p=>p.name===n||p.id===n);
const pEmoji = n => (pillarBy(n)||{}).emoji||'•';
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr = () => ymd(new Date());
const parseYmd = s => { const [y,m,d]=String(s).split('-').map(Number); return new Date(y,(m||1)-1,d||1); };
const daysBetween = (a,b) => Math.round((parseYmd(b)-parseYmd(a))/86400000);
const fmtDate = s => s ? parseYmd(s).toLocaleDateString(undefined,{month:'short',day:'numeric',year: parseYmd(s).getFullYear()!==new Date().getFullYear()?'numeric':undefined}) : '';
const fmtTime = t => { if(!/^\d{1,2}:\d{2}$/.test(t||'')) return t||''; let [h,m] = t.split(':').map(Number); const ap = h>=12?'PM':'AM'; h = h%12||12; return h+(m?':'+pad(m):'')+' '+ap; };
const money = v => v===''||v==null ? '' : '$'+Number(v).toLocaleString(undefined,{maximumFractionDigits:2});
const stars = n => n ? '<span class="stars">'+'★'.repeat(+n)+'☆'.repeat(5-n)+'</span>' : '';
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
// Firebase returns keys sorted, so keep records key-sorted locally too —
// that way "did this change since I last pushed it" is a plain string compare.
const norm = r => { const o={}; Object.keys(r).sort().forEach(k=>{ if(r[k]!==undefined&&r[k]!==null) o[k]=r[k]; }); return o; };

function lsGet(k,def){ try{ const v=localStorage.getItem(k); return v==null?def:JSON.parse(v); }catch(e){ return def; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ toast('Phone storage is full — try removing some photos'); return false; } }
function load(col){ const v=lsGet('trishbad_'+col,[]); return Array.isArray(v)?v:[]; }
function save(col,arr){ return lsSet('trishbad_'+col,arr); }

let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }
function copyText(s){
  const done=()=>toast('Copied ✓');
  if(navigator.clipboard&&window.isSecureContext){ navigator.clipboard.writeText(s).then(done).catch(()=>fallbackCopy(s)); }
  else fallbackCopy(s);
}
function fallbackCopy(s){ const ta=document.createElement('textarea'); ta.value=s; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); toast('Copied ✓');}catch(e){ toast('Could not copy'); } ta.remove(); }

function chipClass(v){
  if(['Posted','Paid','Owned','Done','Keeping all','Using','Repurchase','Active','Yes'].includes(v)) return 'ok';
  if(['Filmed','Scripted','Contract','Filming','Talking','Some returns','Reached out','Sample','Planned'].includes(v)) return 'warn';
  if(['Returned','Sold','Finished','Empty','Passed'].includes(v)) return 'bad';
  return '';
}

      ${(c.filters||[]).map(f=>`<select data-input="colf" data-col="${col}" data-k="${f.k}"><option value="">${f.l}</option>${f.o.map(o=>`<option ${st.f[f.k]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`).join('')}
    </div>
    <div id="col-list"></div>`;

function renderColList(col){
  const c = COLS[col], st = colState[col]||{q:'',f:{}};
  let arr = load(col);
  const sumEl = $('#col-summary');
  if(sumEl) sumEl.textContent = c.summary && arr.length ? c.summary(arr) : (arr.length? arr.length+' '+c.noun+(arr.length===1?'':'s'):'');
  const q = st.q.trim().toLowerCase();
  if(q) arr = arr.filter(r=>Object.values(r).some(v=>typeof v==='string' && !v.startsWith('data:') && v.toLowerCase().includes(q)));
  Object.keys(st.f).forEach(k=>{ if(st.f[k]) arr = arr.filter(r=>r[k]===st.f[k]); });
  if(c.sort) arr.sort(c.sort);
  const list = $('#col-list'); if(!list) return;
  list.innerHTML = arr.length ? arr.map(r=>recCard(col,r)).join('') : `<div class="empty">${load(col).length?'Nothing matches that search.':(c.empty||'Nothing here yet.')}</div>`;
}
function recCard(col, r){
  const c = COLS[col];
  const title = c.title(r);
  const line = c.line ? c.line(r) : '';
  const body = c.body ? c.body(r) : (c.fields.some(f=>f.k==='notes') ? r.notes : '');
  const chips = (c.chips||[]).filter(k=>r[k]).map(k=>`<span class="chip ${chipClass(r[k])}">${k==='pillar'?pEmoji(r[k])+' ':''}${esc(r[k])}</span>`);
  const badge = c.badge ? c.badge(r) : '';
  if(badge) chips.push(`<span class="chip ok">✓ ${esc(badge)}</span>`);
  const photo = c.photo && /^data:/.test(r[c.photo]||'') ? `<img class="thumb" src="${r[c.photo]}" alt="" loading="lazy">` : '';
  const link = c.link && r[c.link] ? ` · <a href="${esc(r[c.link])}" target="_blank" rel="noopener">open ↗</a>` : '';
  return `<div class="card rec">
    ${photo}
    <div class="body">
      <div class="t">${esc(title)}</div>
      ${line||link?`<div class="s">${esc(line)}${link}</div>`:''}
      ${c.rating&&r[c.rating]?stars(r[c.rating]):''}
      ${chips.length?`<div class="chips">${chips.join('')}</div>`:''}
      ${body?`<div class="n">${esc(body)}</div>`:''}
    </div>
    <div class="acts">
      ${c.copy?`<button class="icon-btn" title="Copy" data-act="copyrec" data-col="${col}" data-id="${r.id}">📋</button>`:''}
      ${c.extraActs?c.extraActs(r):''}
      <button class="icon-btn" title="Edit" data-act="edit" data-col="${col}" data-id="${r.id}">✏️</button>
      <button class="icon-btn" title="Delete" data-act="del" data-col="${col}" data-id="${r.id}">🗑️</button>
    </div>
  </div>`;
}

let formCtx = null;
function openForm(col, id, defaults, after){
  const c = COLS[col];
  const rec = id ? load(col).find(r=>r.id===id) : Object.assign({}, defaults||{});
  if(!rec) return;
  formCtx = {col, id, photos:{}, after};
  const fieldHTML = c.fields.map(f=>{
    const v = rec[f.k]; const nm = `name="${f.k}"`;
    let input;
    switch(f.t){
      case 'textarea': input=`<textarea ${nm}>${esc(v)}</textarea>`; break;
      case 'select': { const opts = typeof f.o==='function' ? f.o() : f.o;
        input=`<select ${nm}><option value="">—</option>${opts.map(o=>{ const [ov,ol]=Array.isArray(o)?o:[o,o]; return `<option value="${esc(ov)}" ${v===ov?'selected':''}>${esc(ol)}</option>`; }).join('')}</select>`; break; }
      case 'rating': input=`<select ${nm}><option value="">—</option>${[5,4,3,2,1].map(n=>`<option value="${n}" ${+v===n?'selected':''}>${'★'.repeat(n)}</option>`).join('')}</select>`; break;
      case 'check': return `<div class="field"><label class="check"><input type="checkbox" ${nm} ${v?'checked':''}> ${esc(f.l)}</label></div>`;
      case 'photo':
        formCtx.photos[f.k] = v||'';
        input = `<div id="ph-${f.k}">${photoInner(f.k)}</div><input type="file" accept="image/*" data-input="photo" data-k="${f.k}">`; break;
      case 'number': input=`<input type="number" inputmode="decimal" step="any" ${nm} value="${esc(v)}">`; break;
      default: input=`<input type="${f.t}" ${nm} value="${esc(v)}" ${f.t==='text'?'autocomplete="off"':''}>`;
    }
    return `<div class="field"><label>${esc(f.l)}${f.req?' *':''}</label>${input}</div>`;
  }).join('');
  $('#modal-root').innerHTML = `<div class="overlay" data-act="closeform"><form class="sheet" id="rec-form" onsubmit="return false">
    <h3>${id?'Edit':'Add'} ${esc(c.noun)}</h3>${fieldHTML}
    <div class="sheet-acts"><button type="button" class="btn ghost" data-act="closeform">Cancel</button><button type="button" class="btn primary" data-act="saveform">Save</button></div>
  </form></div>`;
  document.body.style.overflow='hidden';
}
function photoInner(k){
  const src = formCtx.photos[k];
  return /^data:/.test(src||'') ? `<img class="photo-prev" src="${src}" alt=""><button type="button" class="btn sm ghost" data-act="rmphoto" data-k="${k}">Remove photo</button>` : '';
}
function closeForm(){ $('#modal-root').innerHTML=''; formCtx=null; document.body.style.overflow=''; }
function saveForm(){
  const {col,id,after} = formCtx; const c = COLS[col];
  const form = $('#rec-form');
  const arr = load(col);
  const rec = id ? Object.assign({}, arr.find(r=>r.id===id)) : {id:uid(), c:Date.now()};
  for(const f of c.fields){
    if(f.t==='photo'){ rec[f.k]=formCtx.photos[f.k]||''; continue; }
    const inp = form.querySelector(`[name="${f.k}"]`); // not form.elements[k] — 'length' would return the field count
    const val = f.t==='check' ? inp.checked : inp.value.trim();
    if(f.req && !val){ toast('Please fill in "'+f.l+'"'); inp.focus(); return; }
    rec[f.k] = val;
  }
  rec.u = Date.now();
  const r = norm(rec);
  const i = arr.findIndex(x=>x.id===r.id);
  if(i>=0) arr[i]=r; else arr.push(r);
  if(!save(col,arr)) return;
  pushRecord(col,r);
  closeForm();
  if(after) after(r);
  rerender();
  toast(id?'Saved ✓':'Added ✓');
}
function compressImage(file, cb){
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 600, s = Math.min(1, max/Math.max(img.width,img.height));
      const cv = document.createElement('canvas'); cv.width=Math.round(img.width*s); cv.height=Math.round(img.height*s);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      cb(cv.toDataURL('image/jpeg',0.7));
    };
    img.onerror = () => toast('Could not read that photo');
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
function deleteRec(col,id){
  const c = COLS[col]; const r = load(col).find(x=>x.id===id); if(!r) return;
  if(!confirm('Delete this '+c.noun+'?')) return;
  save(col, load(col).filter(x=>x.id!==id));
  deleteRemote(col,id);
  rerender(); toast('Deleted');
}
function addRec(col, data){
  const r = norm(Object.assign({id:uid(), c:Date.now(), u:Date.now()}, data));
  const arr = load(col); arr.push(r); save(col,arr); pushRecord(col,r); return r;
}

function dayNum(){ return Math.floor(parseYmd(todayStr()).getTime()/86400000); }
function renderDashboard(el){
  const today = todayStr(), n = dayNum();
  const nailsP = pillarBy('nails'), grwmP = pillarBy('grwm');
  const others = PILLARS.filter(p=>!p.star);
  const wild = others[n % others.length];
  const picks = [
    {p:grwmP, i:(n*7) % grwmP.ideas.length, label:'Today\'s GRWM'},
    {p:nailsP, i:n % nailsP.ideas.length, label:'Today\'s nail idea'},
    {p:wild, i:(n*3) % wild.ideas.length, label:'Wildcard · '+wild.name}
  ];
  const posts = load('posts');
  const week = posts.filter(r=>r.date>=today && daysBetween(today,r.date)<=7).sort(COLS.posts.sort);
  const monthKey = today.slice(0,7);
  const monthPosts = posts.filter(r=>(r.date||'').startsWith(monthKey));
  const nails = load('nails').filter(r=>r.date).sort(COLS.nails.sort);
  const fillDays = +lsGet('trishbad__fillDays',21)||21;
  let nailHTML;
  if(nails.length){
    const last = nails[0], since = daysBetween(last.date,today), left = fillDays - since;
    const next = new Date(parseYmd(last.date).getTime()+fillDays*86400000);

// ═══════════════════════════════════════════════
// SERIES HUBS — The XXL Nail Diaries + Scent Diaries
// One engine drives both. Built-in episodes are read-only templates; progress
// lives in the synced "episodes" collection (ep = template id). Each record's
// series name tells which show it belongs to (older records are all XXL).
// ═══════════════════════════════════════════════
const SHOWS = {
  xxl:{id:'xxl', title:'The XXL Nail Diaries', emoji:'💅', blurb:'Luxe XXL sets + funny, real-life proof that I can (mostly) do it all.',
       series:XXL_SERIES, episodes:XXL_EPISODES, weeklyKey:'weeks', pillar:'Nails', prefix:'[XXL Nail Diaries]',
       link:{field:'nailSet', label:'Nail set', opts:()=>nailSetOptions(), col:'nails', chip:r=>'💅 '+(r.color||r.type||'Nail set')},
       checklistTitle:'🎬 XXL filming checklist', shootDays:[1,3,5]},
  scent:{id:'scent', title:'Scent Diaries', emoji:'🌸', blurb:'Vanilla-obsessed perfume content — luxe layers, funny tests and pretty dumps.',
       series:SCENT_SERIES, episodes:SCENT_EPISODES, weeklyKey:'perfumeWeeks', pillar:'Perfume', prefix:'[Scent Diaries]',
       link:{field:'perfume', label:'Perfume', opts:()=>perfumeOptions(), col:'perfume', chip:r=>'🌸 '+(r.name||'Perfume')},
       checklistTitle:'🎬 Perfume filming checklist', shootDays:[2,4,6]}
};
const ALL_SERIES = XXL_SERIES.map(x=>Object.assign({show:'xxl'},x)).concat(SCENT_SERIES.map(x=>Object.assign({show:'scent'},x)));
const seriesById = id => ALL_SERIES.find(x=>x.id===id);
const seriesByName = n => ALL_SERIES.find(x=>x.name===n) || {id:'', show:'xxl', name:n||'Custom', short:n||'Custom', emoji:'💅'};
const hubState = {xxl:{series:'', status:'', q:''}, scent:{series:'', status:'', q:'', view:'episodes', occ:'date'}};
const xxlOpen = new Set();   // open episode cards (both hubs)

// Fresh ideas added every week to weekly-ideas.json — "weeks" for XXL nails,
// "perfumeWeeks" for Scent Diaries. Cached on the phone for offline use.
const WEEKLY = {xxl:[], scent:[]}, WEEKLY_LATEST = {xxl:'', scent:''};
const showTemplates = sh => SHOWS[sh].episodes.concat(WEEKLY[sh]);
const allTemplates = () => showTemplates('xxl').concat(showTemplates('scent'));
function setWeekly(data){
  Object.keys(SHOWS).forEach(sh=>{
    const S = SHOWS[sh];
    const valid = e => e && typeof e.id==='string' && S.series.some(x=>x.id===e.s) && typeof e.t==='string' && Array.isArray(e.sh) && Array.isArray(e.tg);
    const eps = [];
    ((data&&data[S.weeklyKey])||[]).forEach(w=>{
      if(!w || typeof w.week!=='string') return;
      (w.ideas||[]).filter(valid).forEach((e,n)=>{ if(!S.episodes.some(b=>b.id===e.id)) eps.push(Object.assign({}, e, {wk:w.week, n, h:e.h||'', c:e.c||'', cta:e.cta||'', f:e.f||''})); });
    });
    WEEKLY[sh] = eps;
    WEEKLY_LATEST[sh] = eps.reduce((m,e)=>e.wk>m?e.wk:m, '');
  });
}
function loadWeekly(){
  setWeekly(lsGet('trishbad__weekly', null));
  fetch('weekly-ideas.json', {cache:'no-store'})
    .then(r=>r.ok?r.json():Promise.reject())
    .then(data=>{
      const sig = () => JSON.stringify(WEEKLY_LATEST)+WEEKLY.xxl.length+'/'+WEEKLY.scent.length;
      const before = sig(); setWeekly(data); lsSet('trishbad__weekly', data);
      if(sig()!==before && (SHOWS[curPanel]||curPanel==='dashboard')) softRender();
      autoSchedule();
    })
    .catch(()=>{});
}
function nailSetOptions(){
  return load('nails').filter(r=>r.date).sort(COLS.nails.sort).map(r=>[r.id, fmtDate(r.date)+' · '+(r.color||r.type||'Nail set')]);
}
function perfumeOptions(){
  return load('perfume').sort(COLS.perfume.sort).map(r=>[r.id, r.name+(r.house?' · '+r.house:'')+(r.status&&r.status!=='Owned'?' ('+r.status+')':'')]);
}
function epFromTemplate(e){
  return {ep:e.id, wk:e.wk||'', series:seriesById(e.s).name, title:e.t, hook:e.h, shots:e.sh.join('\n'), caption:e.c, tags:e.tg.join(' '), cta:e.cta, format:e.f};
}
// Every episode of a show: templates merged with your progress, plus custom ones.
// If two devices both started the same template before syncing, the newest edit wins.
function showEpisodes(sh){
  const tracked = load('episodes'), byEp = {};
  tracked.forEach(r=>{ if(r.ep && (!byEp[r.ep] || (r.u||0)>(byEp[r.ep].u||0))) byEp[r.ep]=r; });
  const out = showTemplates(sh).map(e=>{
    const r = byEp[e.id];
    return r ? Object.assign(epFromTemplate(e), r, {wk:e.wk||'', key:r.id, tracked:true}) : Object.assign(epFromTemplate(e), {key:'b:'+e.id, tracked:false, status:''});
  });
  const tpl = allTemplates();
  tracked.forEach(r=>{ if((!r.ep || !tpl.some(e=>e.id===r.ep)) && seriesByName(r.series).show===sh) out.push(Object.assign({}, r, {key:r.id, tracked:true, custom:true})); });
  const isNew = e => e.wk && e.wk===WEEKLY_LATEST[sh];
  return out.filter(isNew).concat(out.filter(e=>!isNew(e)));
}
const allEpisodes = () => showEpisodes('xxl').concat(showEpisodes('scent'));
// Turn a built-in template into a tracked record the first time you act on it.
function ensureEpisode(key){
  if(!key.startsWith('b:')) return key;
  const e = allTemplates().find(x=>x.id===key.slice(2)); if(!e) return null;
  const existing = load('episodes').filter(r=>r.ep===e.id).sort((a,b)=>(b.u||0)-(a.u||0))[0];
  if(existing) return existing.id;
  return addRec('episodes', Object.assign(epFromTemplate(e), {id:'ep-'+e.id+'-'+Date.now().toString(36), status:'Idea'})).id;
}
function updateEpisode(id, patch){
  const arr = load('episodes'), i = arr.findIndex(r=>r.id===id); if(i<0) return;
  const r = norm(Object.assign({}, arr[i], patch, {u:Date.now()}));
  arr[i] = r; save('episodes', arr); pushRecord('episodes', r);
}
function epCaption(ep){ return [ep.caption, ep.cta, ep.tags].filter(Boolean).join('\n\n'); }
function hubFilter(sh, list){
  const st = hubState[sh];
  if(st.series==='week') list = list.filter(e=>e.wk && e.wk===WEEKLY_LATEST[sh]);
  else if(st.series) list = list.filter(e=>seriesByName(e.series).id===st.series);
  if(st.status) list = list.filter(e=>st.status==='new' ? !e.status : e.status===st.status);
  return list;
}
function hubDashCard(sh){
  const S = SHOWS[sh], eps = showEpisodes(sh), posted = eps.filter(e=>e.status==='Posted').length;
  const fresh = eps.filter(e=>e.wk && e.wk===WEEKLY_LATEST[sh] && !e.status).length;
  let next = null;
  for(const st of ['Edited','Filmed','Scripted','Scheduled','Idea']){ next = eps.find(e=>e.status===st); if(next) break; }
  if(!next) next = eps.find(e=>!e.status);
  return `<div class="card"><div class="pick-label">${S.emoji} ${esc(S.title)}</div>
    <div class="pick-idea">${next?esc(next.title):'Every episode posted. Iconic.'}</div>
    <div class="small muted" style="margin-bottom:10px">${next&&next.status?'Up next · '+esc(next.status):'Up next'} · ${posted}/${eps.length} posted</div>
    ${fresh?`<div class="small" style="margin-bottom:10px">✨ <b>${fresh} fresh idea${fresh===1?'':'s'}</b> added this week</div>`:''}
    <button class="btn sm" data-act="${fresh?'hubweek':'panel'}" data-show="${sh}" data-id="${sh}">${fresh?'See this week\'s ideas →':'Open '+esc(S.title)+' →'}</button></div>`;
}
function renderHub(sh, el){
  const S = SHOWS[sh], st = hubState[sh];

function scentFamilies(text){
  const t = String(text||'').toLowerCase();
  return Object.keys(SCENT_FAMILIES).filter(f=>SCENT_FAMILIES[f].some(w=>t.includes(w)));
}
// Pairs from your own perfumes: one that suits the occasion as a base, one as the accent.
function myPairs(occ){
  const mine = load('perfume').filter(r=>r.status==='Owned'||r.status==='Sample'||!r.status)
    .map(r=>({r, fam:scentFamilies([r.name,r.house,r.notes_scent,r.notes].join(' '))})).filter(x=>x.fam.length);
  const fit = (x, fams) => fams.filter(f=>x.fam.includes(f)).length + (x.r.season===occ.season?1:0);
  const out = [];
  mine.forEach(a=>{ if(!fit(a,occ.base)) return;
    mine.forEach(b=>{ if(a===b || !fit(b,occ.accent)) return;
      const score = fit(a,occ.base)*2 + fit(b,occ.accent) + (a.fam.includes('vanilla')?2:0);
      out.push({a:a.r, b:b.r, score});
    });
  });
  out.sort((x,y)=>y.score-x.score);
  const seen = new Set(), res = [];
  for(const p of out){ const k=[p.a.id,p.b.id].sort().join('|'); if(seen.has(k)) continue; seen.add(k); res.push(p); if(res.length===3) break; }
  return {pairs:res, withNotes:mine.length, total:load('perfume').length};
}

// ── Weekly ideas → Calendar shoot days ──
// Each new weekly idea becomes a Planned post on its own day (nails Mon/Wed/Fri,
// perfume Tue/Thu/Sat after the week's date, or "d" if the idea sets one).
// Ids are fixed ("wk-<idea id>") so two phones never double-add, and it only runs
// after a successful sync so a shoot day you deleted never comes back.
let syncedDead = null;
function shootDate(sh, e){
  if(/^\d{4}-\d{2}-\d{2}$/.test(e.d||'')) return e.d;
  const d = parseYmd(e.wk); d.setDate(d.getDate() + (SHOWS[sh].shootDays[e.n] || SHOWS[sh].shootDays[0] + e.n));
  return ymd(d);
}
function autoSchedule(){
  if(!syncedDead) return;
  const posts = load('posts'), have = new Set(posts.map(p=>p.id));
  const tombs = new Set(localTombs().map(t=>t.id));
  const eps = load('episodes'), tracked = new Set(eps.map(r=>r.ep).filter(Boolean)), haveEp = new Set(eps.map(r=>r.id));
  const cutoff = (()=>{ const d=new Date(); d.setDate(d.getDate()-7); return ymd(d); })();
  const blocked = id => have.has(id) || syncedDead[id] || tombs.has(id);
  let added = 0;
  Object.keys(SHOWS).forEach(sh=>{
    const S = SHOWS[sh];
    WEEKLY[sh].forEach(e=>{
      const date = shootDate(sh, e); if(date < cutoff) return;
      const pid = 'wk-'+e.id, plan = platformPlan(epFromTemplate(e)), times = postTimes();
      if(!blocked(pid)){
        const notes = ['🎬 Shoot + post day', '📱 '+plan.where, e.h&&('Hook: '+e.h), 'Shots:\n'+e.sh.map((x,i)=>(i+1)+'. '+x).join('\n'), e.c&&('Caption: '+e.c), e.cta&&('CTA: '+e.cta), e.tg.join(' ')].filter(Boolean).join('\n');
        const r = norm({id:pid, c:Date.now(), u:Date.now(), title:S.prefix+' '+e.t, date, time:times.tiktok, where:'TikTok + Instagram', pillar:S.pillar, status:'Planned', notes});
        posts.push(r); pushRecord('posts', r); added++;
      } else {
        // Shoot days added before posting times existed get them once (never overwrites your edits)
        const i = posts.findIndex(x=>x.id===pid);
        if(i>=0 && !posts[i].where && !posts[i].time){ posts[i] = norm(Object.assign({}, posts[i], {time:times.tiktok, where:'TikTok + Instagram', u:Date.now()})); pushRecord('posts', posts[i]); }
      }
      const pinId = 'pin-'+e.id;
      if(!blocked(pinId)){
        const pd = parseYmd(date); pd.setDate(pd.getDate()+1);
        const pin = plan.pinterest;
        const notes = ['📌 Pinterest day', 'Board: '+pin.board, 'Type: '+pin.type, 'Title: '+pin.title, 'Description: '+pin.desc].join('\n');
        const r = norm({id:pinId, c:Date.now(), u:Date.now(), title:'📌 Pin: '+pin.title, date:ymd(pd), time:times.pinterest, where:'Pinterest', pillar:S.pillar, status:'Planned', notes});
        posts.push(r); pushRecord('posts', r); added++;
      }
      const eid = 'ep-'+e.id+'-cal';
      if(!tracked.has(e.id) && !haveEp.has(eid) && !syncedDead[eid] && !tombs.has(eid)){
        const r = norm(Object.assign(epFromTemplate(e), {id:eid, c:Date.now(), u:Date.now(), status:'Scheduled', date}));
        eps.push(r); pushRecord('episodes', r);
      }
    });
  });
  save('posts', posts); save('episodes', eps);
  if(added){ toast('📅 Added '+added+' post'+(added===1?'':'s')+' to your Calendar'); softRender(); }
}

// PLATFORM PLANS — one idea, three posts
// ═══════════════════════════════════════════════
function platformPlan(ep){
  const ser = seriesByName(ep.series), times = postTimes(), links = myLinks();
  const board = PIN_BOARDS.find(b=>b.id===(SERIES_BOARD[ser.id]||'lifestyle'));
  const isDump = /dump/.test(ser.id) || /carousel/i.test(ep.format||'');
  const tags = String(ep.tags||'').split(/\s+/).filter(Boolean);
  const cap = /^caption prompt/i.test(ep.caption||'') ? (ep.hook||'') : String(ep.caption||'').replace(/Verdict:\s*_+/,'Wait for the verdict 👀');
  const clean = String(ep.title||'').replace(/[?!.]+$/,'');
  const kw = board.kw[0].replace(/\b\w/g,c=>c.toUpperCase());
  let pinTitle = clean.toLowerCase().includes(board.kw[0].split(' ')[0]) ? clean : kw+': '+clean;
  if(pinTitle.length>100) pinTitle = pinTitle.slice(0,97).replace(/\s+\S*$/,'')+'…';
  const desc = [ep.hook, cap.replace(/\s*#\w+/g,''), 'More '+board.kw.slice(0,3).join(', ')+' ideas on my boards.', links.ltk?'Shop my favorites: '+links.ltk:''].filter(Boolean).join(' ').replace(/\s+/g,' ').trim();
  return {
    where:`TikTok ${fmtTime(times.tiktok)} · Instagram ${fmtTime(times.instagram)} · Pinterest next day ${fmtTime(times.pinterest)}`,
    tiktok:{when:fmtTime(times.tiktok), type:isDump?'Photo mode carousel':'Video', text:[ep.hook&&('On-screen text: '+ep.hook), [ep.caption&&cap, ep.cta].filter(Boolean).join(' '), tags.join(' ')].filter(Boolean).join('\n')},
    instagram:{when:fmtTime(times.instagram), type:isDump?'Carousel post':'Reel', text:[cap, ep.cta, '.', tags.slice(0,5).join(' ')].filter(Boolean).join('\n'), extra:isDump?'Share slide 1 to your Story with a poll sticker.':'Share the Reel to your Story with a poll or question sticker.'},
    pinterest:{when:'Next day '+fmtTime(times.pinterest), type:isDump?'Image pin (2:3) — best slide with title text':'Video pin — upload without the TikTok watermark', board:board.name, title:pinTitle, desc, link:links.ltk||''}
  };
}

      <div class="ctrls" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">${[['tiktok','📱 TikTok'],['instagram','📸 Instagram'],['pinterest','📌 Pinterest']].map(([k,l])=>`<div class="field" style="margin:0"><label>${l}</label><input type="time" value="${esc(postTimes()[k])}" data-input="ptime" data-k="${k}"></div>`).join('')}</div></div>

    <div class="card"><b>Sync</b><div class="small muted" style="margin:4px 0 10px">Your entries sync to your other devices whenever you're online — the dot at the top shows green when synced and grey when it couldn't reach the cloud (your entries stay saved on this phone and sync next time). The filming checklists stay on this phone.</div><button class="btn" data-act="syncnow">🔄 Sync now</button></div>

}
function applyTheme(){
  const t = lsGet('trishbad__theme','auto');
  const dark = t==='dark' || (t==='auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.body.classList.toggle('dark', dark);
}
function exportBackup(){
  const out = {app:'trishbad', at:new Date().toISOString(), data:{}};
  COL_KEYS.forEach(k=>out.data[k]=load(k));
  out.checklist = getChecklist('film');
  out.times = lsGet('trishbad__times', {}); out.links = lsGet('trishbad__links', {});
  const blob = new Blob([JSON.stringify(out)],{type:'application/json'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='trish-badd-backup-'+todayStr()+'.json'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function importBackup(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const j = JSON.parse(reader.result);
      if(!j || j.app!=='trishbad' || !j.data) throw 0;
      if(!confirm('Restore this backup? Items in the backup will be added back or updated.')) return;
      COL_KEYS.forEach(k=>{
        if(!Array.isArray(j.data[k])) return;
        const byId = {}; load(k).forEach(r=>byId[r.id]=r);
        j.data[k].forEach(r=>{ if(r&&r.id){ byId[r.id]=norm(Object.assign({},r,{u:Date.now()})); } });
        save(k, Object.values(byId));
      });
      if(Array.isArray(j.checklist)) lsSet('trishbad__checklist', j.checklist);
      if(j.times && typeof j.times==='object') lsSet('trishbad__times', j.times);
      if(j.links && typeof j.links==='object') lsSet('trishbad__links', j.links);
      pushAll(); toast('Backup restored ✓'); rerender();
    }catch(e){ toast('That file isn\'t a Trish Badd backup'); }
  };
  reader.readAsText(file);
}

// ═══════════════════════════════════════════════
// CLOUD SYNC — same Firebase project as Titles by Trish, under /trishbad.
// Each record lives at /trishbad/{collection}/{id}; newest edit (u) wins.
// Deletes are explicit tombstones at /trishbad/_deleted/{id} — a record
// missing on one device never counts as a delete.
// ═══════════════════════════════════════════════
const FB = 'https://titles-by-trish-default-rtdb.firebaseio.com/trishbad';
// Photos live outside /trishbad so the regular sync pull stays tiny. A record
// in the cloud holds "ph:<hash>" in place of the photo; each device fetches
// the photo itself once and keeps it locally.
const FB_PHOTOS = 'https://titles-by-trish-default-rtdb.firebaseio.com/trishbad_photos';
const pushed = {}, photoUp = {}, photoGet = {};
const photoKeys = col => COLS[col].fields.filter(f=>f.t==='photo').map(f=>f.k);
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return 'p'+(h>>>0).toString(36)+s.length.toString(36); }
function toRemote(col,r){ const o=Object.assign({},r); photoKeys(col).forEach(k=>{ if(/^data:/.test(o[k]||'')) o[k]='ph:'+hashStr(o[k]); }); return o; }
function uploadPhoto(dataUrl){
  const h = hashStr(dataUrl);
  if(photoUp[h]) return Promise.resolve(true);
  return fetch(`${FB_PHOTOS}/${h}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(dataUrl)})
    .then(res=>{ if(res.ok) photoUp[h]=true; return res.ok; });
}
function fetchMissingPhotos(){
  COL_KEYS.forEach(col=>photoKeys(col).forEach(k=>load(col).forEach(r=>{
    const ref = r[k]; if(!/^ph:/.test(ref||'') || photoGet[ref]) return;
    photoGet[ref] = true;
    fetch(`${FB_PHOTOS}/${ref.slice(3)}.json`).then(res=>res.ok?res.json():null).then(url=>{
      delete photoGet[ref];
      if(typeof url!=='string' || !/^data:/.test(url)) return;
      const arr = load(col), x = arr.find(y=>y.id===r.id);
      if(x && x[k]===ref){ x[k]=url; save(col,arr); photoUp[ref.slice(3)]=true; softRender(); }
    }).catch(()=>{ delete photoGet[ref]; });
  })));
}
let softT;
function softRender(){
  clearTimeout(softT);
  softT = setTimeout(()=>{ if(!formCtx && !(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) PANELS[curPanel].render($('#panel')); }, 300);
}
function syncDot(s){
  const d=$('#sync-dot'), t=$('#sync-txt'); if(!d) return;
  if(s==='ok'){ d.style.background='#5fae7c'; t.textContent='Synced across devices'; }
  else if(s==='syncing'){ d.style.background='#c9a66b'; t.textContent='Syncing…'; }
  else { d.style.background='#777'; t.textContent='Offline — saved on this phone'; }
}
function pushRecord(col, r){
  const rem = toRemote(col,r), key = col+'/'+r.id, json = JSON.stringify(rem);
  if(pushed[key]===json) return;
  syncDot('syncing');
  // Upload photos first so another device never sees a record whose photo isn't there yet
  Promise.all(photoKeys(col).filter(k=>/^data:/.test(r[k]||'')).map(k=>uploadPhoto(r[k])))
    .then(oks=>{ if(!oks.every(Boolean)) throw 0;
      return fetch(`${FB}/${col}/${encodeURIComponent(r.id)}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:json}); })
    .then(res=>{ if(res.ok){ pushed[key]=json; syncDot('ok'); } else syncDot('off'); })
    .catch(()=>syncDot('off'));
}
function pushAll(){ COL_KEYS.forEach(col=>load(col).forEach(r=>pushRecord(col,r))); }
function localTombs(){ return lsGet('trishbad__tombs',[]); }
function deleteRemote(col,id){
  const t = localTombs(); t.push({col,id}); lsSet('trishbad__tombs',t);
  flushTombs();
}
function flushTombs(){
  localTombs().forEach(t=>{
    Promise.all([
      fetch(`${FB}/_deleted/${encodeURIComponent(t.id)}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:'true'}),
      fetch(`${FB}/${t.col}/${encodeURIComponent(t.id)}.json`,{method:'DELETE'})
    ]).then(rs=>{
      if(rs.every(r=>r.ok)){ lsSet('trishbad__tombs', localTombs().filter(x=>x.id!==t.id)); delete pushed[t.col+'/'+t.id]; }
    }).catch(()=>{});
  });
}
let pulling = false;
function pullAll(){
  if(pulling) return; pulling = true;
  syncDot('syncing');
  fetch(FB+'.json',{cache:'no-store'})
    .then(r=>r.ok?r.json():Promise.reject())
    .then(data=>{
      data = data || {};
      const dead = Object.assign({}, data._deleted||{});
      localTombs().forEach(t=>dead[t.id]=true);
      let changed = false;
      COL_KEYS.forEach(col=>{
        const remote = data[col] || {};
        const before = load(col);
        const byId = {};
        before.forEach(r=>{ if(dead[r.id]) changed=true; else byId[r.id]=r; });
        Object.keys(remote).forEach(id=>{
          const rr = remote[id]; if(!rr || dead[id]) return;
          const l = byId[id];
          if(!l || (rr.u||0) > (l.u||0)){
            const nr = norm(rr);
            // Keep the photo we already have if it's the same one
            if(l) photoKeys(col).forEach(k=>{ if(/^ph:/.test(nr[k]||'') && /^data:/.test(l[k]||'') && 'ph:'+hashStr(l[k])===nr[k]) nr[k]=l[k]; });
            byId[id]=nr; changed=true;
          }
          if(!l || (rr.u||0) >= (l.u||0)) pushed[col+'/'+id]=JSON.stringify(norm(rr));
        });
        save(col, Object.values(byId));
      });
      flushTombs(); pushAll(); fetchMissingPhotos();
      syncDot('ok');
      syncedDead = dead;
      autoSchedule();
      if(changed) softRender();
    })
    .catch(()=>syncDot('off'))
    .finally(()=>{ pulling=false; });
}

// ═══════════════════════════════════════════════
// SEED DEFAULTS (fixed ids so two devices never double-seed)
// ═══════════════════════════════════════════════
function seedDefaults(){
  if(localStorage.getItem('trishbad_ctas')==null) save('ctas', DEFAULT_CTAS.map((t,i)=>norm({id:'seed-cta-'+i, text:t, c:i, u:1})));
  if(localStorage.getItem('trishbad_dms')==null) save('dms', DEFAULT_DMS.map((d,i)=>norm({id:'seed-dm-'+i, title:d.title, text:d.text, c:i, u:1})));
  // Fix the @handle in the brand pitch seeded before the spelling was corrected
  const dms = load('dms'), pitch = dms.find(r=>r.id==='seed-dm-0');
  if(pitch && pitch.text.includes('(@trishbad)')){ pitch.text=pitch.text.replace('(@trishbad)','(@trishbadd)'); pitch.u=Date.now(); save('dms',dms); }
}

// ═══════════════════════════════════════════════
// EVENTS
// ═══════════════════════════════════════════════
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act, d = b.dataset;
  if(b.tagName==='A') e.preventDefault();
  if(a==='closeform' && e.target!==b) return; // clicks inside the sheet don't close it
  switch(a){
    case 'group': { const g=GROUPS.find(x=>x.id===d.id); showPanel(g.panels[0]); break; }
    case 'panel': showPanel(d.id); break;
    case 'add': openForm(d.col, null, d.col==='nails'||d.col==='ootd'||d.col==='hauls'||d.col==='sessions' ? {date:todayStr()} : {}); break;
    case 'edit': openForm(d.col, d.id); break;
    case 'del': deleteRec(d.col, d.id); break;
    case 'copyrec': { const r=load(d.col).find(x=>x.id===d.id); if(r) copyText(COLS[d.col].copy(r)); break; }
    case 'copy': copyText(d.text); break;
    case 'closeform': closeForm(); break;
    case 'saveform': saveForm(); break;
    case 'rmphoto': formCtx.photos[d.k]=''; $('#ph-'+d.k).innerHTML=''; break;
    case 'save-idea': { const x=ideaOf(d.p,+d.i); saveIdea(x.title,x.pillar); if(curPanel==='pillars') PANELS.pillars.render($('#panel')); break; }
    case 'sched': { const x=ideaOf(d.p,+d.i); scheduleIdea(x.title,x.pillar); break; }
    case 'sched-idea': { const r=load('ideas').find(x=>x.id===d.id); if(r) scheduleIdea(r.title,r.pillar); break; }
    case 'openpillar': openPillar = d.id||null; rerender(); window.scrollTo(0,0); break;
    case 'gen-pillar': genPillar=d.id; generate(); showPanel('generator'); break;
    case 'gen': generate(); rerender(); break;
    case 'gsave': { const p=pillarBy(genResult.pid); saveIdea(p.ideas[genResult.i], p.name, genResult.hook); break; }
    case 'gsched': { const p=pillarBy(genResult.pid); scheduleIdea(p.ideas[genResult.i], p.name); break; }
    case 'calday': calSel=d.id; rerender(); break;
    case 'calnav': calMonth=new Date(calMonth.getFullYear(), calMonth.getMonth()+(+d.id), 1); rerender(); break;
    case 'addpost': openForm('posts', null, {date:calSel, status:'Planned'}); break;
    case 'ckadd': { const inp=$('#ck-new-'+d.list), v=inp?inp.value.trim():''; if(!v) return; const l=getChecklist(d.list); l.push({t:v,d:false}); setChecklist(d.list,l); if(SHOWS[curPanel]) hubRefresh(); else rerender(); break; }
    case 'ckdel': { e.preventDefault(); const l=getChecklist(d.list); l.splice(+d.i,1); setChecklist(d.list,l); if(SHOWS[curPanel]) hubRefresh(); else rerender(); break; }
    case 'ckreset': { setChecklist(d.list, getChecklist(d.list).map(x=>({t:x.t,d:false}))); if(SHOWS[curPanel]) hubRefresh(); else rerender(); break; }
    case 'hubseries': hubState[d.show].series=d.id; rerender(); break;
    case 'hubweek': hubState[d.show].series='week'; hubState[d.show].status=''; if(d.show==='scent') hubState.scent.view='episodes'; showPanel(d.show); break;
    case 'hubadd': { const st=hubState[d.show], S=SHOWS[d.show]; openForm('episodes', null, {status:'Idea', series:(st.series&&st.series!=='week')?seriesById(st.series).name:S.series[0].name}, r=>{ xxlOpen.add(r.id); }); break; }
    case 'scentview': hubState.scent.view=d.id; rerender(); break;
    case 'calopen': calSel=d.id; calMonth=null; showPanel('calendar'); break;
    case 'pinlog': {
      const ep=epByKey(d.key); if(!ep) break;
      if(load('pins').some(p=>p.src===ep.ep)){ toast('Already logged'); break; }
      const pin=platformPlan(ep).pinterest;
      addRec('pins', {title:pin.title, board:pin.board, type:/Video/.test(pin.type)?'Video pin':'Image pin', status:'Pinned', date:todayStr(), link:pin.link, desc:pin.desc, src:ep.ep});
      toast('📌 Logged'); rerender(); break;
    }
    case 'pairocc': hubState.scent.occ=d.id; hubRefresh(); break;
    case 'pairvid': saveIdea(d.text, 'Perfume'); break;
    case 'epcopy': { const ep=epByKey(d.key); if(ep) copyText(epCaption(ep)); break; }
    case 'epsave': { const ep=epByKey(d.key); if(ep) saveIdea(ep.title, SHOWS[seriesByName(ep.series).show].pillar, ep.hook); break; }
    case 'epsched': {
      const ep=epByKey(d.key); if(!ep) break;
      const S=SHOWS[seriesByName(ep.series).show];
      openForm('posts', null, {title:S.prefix+' '+ep.title, pillar:S.pillar, date:todayStr(), status:'Planned', notes:[ep.hook&&('Hook: '+ep.hook), ep.caption].filter(Boolean).join('\n')}, post=>{
        const id = ensureEpisode(d.key); if(!id) return;
        const cur = (load('episodes').find(r=>r.id===id)||{}).status;
        const patch = {date:post.date};
        if(EP_STATUSES.indexOf(cur) < EP_STATUSES.indexOf('Scheduled')) patch.status='Scheduled';
        updateEpisode(id, patch);
        xxlOpen.delete(d.key); xxlOpen.add(id);
      });
      break;
    }
    case 'epedit': { const id=ensureEpisode(d.key); if(!id) break; xxlOpen.delete(d.key); xxlOpen.add(id); openForm('episodes', id); break; }
    case 'epreset': epReset(d.key); break;
    case 'syncnow': pullAll(); toast('Syncing…'); break;
    case 'export': exportBackup(); break;
  }
});
let qT;
document.addEventListener('input', e=>{
  const t = e.target, k = t.dataset && t.dataset.input; if(!k) return;
  if(k==='colq'){ colState[t.dataset.col].q=t.value; clearTimeout(qT); qT=setTimeout(()=>renderColList(t.dataset.col),150); }
  if(k==='hubq'){ const sh=t.dataset.show; hubState[sh].q=t.value; clearTimeout(qT); qT=setTimeout(()=>renderHubList(sh, hubFilter(sh, showEpisodes(sh))),150); }
});
document.addEventListener('change', e=>{
  const t = e.target, k = t.dataset && t.dataset.input; if(!k) return;
  switch(k){
    case 'colf': colState[t.dataset.col].f[t.dataset.k]=t.value; renderColList(t.dataset.col); break;
    case 'genp': genPillar=t.value; break;
    case 'hookf': hookFilter=t.value; rerender(); break;
    case 'ck': { const n=t.dataset.list, l=getChecklist(n); l[+t.dataset.i].d=t.checked; setChecklist(n,l); if(SHOWS[curPanel]) hubRefresh(); else rerender(); break; }
    case 'hubstatus': hubState[t.dataset.show].status=t.value; rerender(); break;
    case 'epstatus': case 'epverdict': case 'eplink': {
      const key=t.dataset.key, field={epstatus:'status',epverdict:'verdict',eplink:t.dataset.field}[k];
      if(k==='epstatus' && !t.value && key.startsWith('b:')) break;
      const id=ensureEpisode(key); if(!id) break;
      updateEpisode(id, {[field]:t.value});
      xxlOpen.delete(key); xxlOpen.add(id);
      hubRefresh(); toast('Saved ✓');
      break;
    }
    case 'theme': lsSet('trishbad__theme',t.value); applyTheme(); break;
    case 'filldays': lsSet('trishbad__fillDays', Math.max(1,+t.value||21)); toast('Saved ✓'); break;
    case 'ptime': { const v=lsGet('trishbad__times',{}); v[t.dataset.k]=t.value||DEFAULT_TIMES[t.dataset.k]; lsSet('trishbad__times',v); toast('Saved ✓'); break; }
    case 'mylink': { const v=lsGet('trishbad__links',{}); v[t.dataset.k]=t.value.trim(); lsSet('trishbad__links',v); toast('Saved ✓'); break; }
    case 'photo': { const f=t.files&&t.files[0]; if(!f) return; compressImage(f, url=>{ formCtx.photos[t.dataset.k]=url; $('#ph-'+t.dataset.k).innerHTML=photoInner(t.dataset.k); }); break; }
    case 'import': if(t.files&&t.files[0]) importBackup(t.files[0]); t.value=''; break;
  }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && formCtx) closeForm();
  if(e.key==='Enter' && e.target.dataset && e.target.dataset.cknew){ e.preventDefault(); const b=document.querySelector(`[data-act="ckadd"][data-list="${e.target.dataset.cknew}"]`); if(b) b.click(); }
});
document.addEventListener('toggle', e=>{
  const el = e.target; if(!el.classList || !el.classList.contains('ep')) return;
  if(el.open) xxlOpen.add(el.dataset.key); else xxlOpen.delete(el.dataset.key);
}, true);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') pullAll(); });
if(window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

// ═══════════════════════════════════════════════
// START
// ═══════════════════════════════════════════════
applyTheme();
seedDefaults();
loadWeekly();
showPanel(lsGet('trishbad__panel','dashboard'));
pullAll();
setInterval(()=>{ if(document.visibilityState==='visible') pullAll(); }, 60000);
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
